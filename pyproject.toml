# uv workspace root for the Python side of the monorepo.
# The root is a virtual project: it only ties the members together and holds shared tooling.

[project]
name = "doppelganger-workspace"
version = "0.0.0"
description = "Doppelgänger Python workspace (engine, model lab, MCP server)"
requires-python = "==3.12.*"
license = "MIT"
dependencies = [
    "doppelganger-contracts",
    "doppelganger-engine",
    "doppelganger-model-lab",
    "doppelganger-mcp",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.87.0",
    "doppelganger-model-lab[lab]",
    "hypothesis==6.170.14",
    "httpx==0.28.1",
    "import-linter==2.15",
    "pip-audit==2.10.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false
required-version = "==0.13.6"

[tool.uv.workspace]
members = ["apps/engine", "packages/contracts", "packages/model-lab", "packages/doppelganger-mcp"]

[tool.uv.sources]
doppelganger-contracts = { workspace = true }
doppelganger-engine = { workspace = true }
doppelganger-model-lab = { workspace = true }
doppelganger-mcp = { workspace = true }
# CPU-only PyTorch wheels (the PyPI wheels pull in several GB of CUDA libraries).
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --- Ruff: one formatter and one linter for Python -------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "apps/engine/src",
    "packages/contracts/src",
    "packages/model-lab/src",
    "packages/doppelganger-mcp/src",
]
extend-exclude = ["**/generated/**"]
# Also skip excluded files when they are passed explicitly (pre-commit passes staged files).
force-exclude = true

[tool.ruff.lint]
# Strict: every rule, minus the few that contradict each other or the formatter.
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211 (no blank line before class docstring)
    "D213",   # conflicts with D212 (summary on the first line)
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "CPY001", # copyright lives in the root LICENSE, not in per-file headers
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",   # assert is how pytest works
    "D",      # test names describe themselves
    "INP001", # test folders are not packages
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# --- mypy: strict on every Python package ----------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
mypy_path = [
    "apps/engine/src",
    "packages/contracts/src",
    "packages/model-lab/src",
    "packages/doppelganger-mcp/src",
]
explicit_package_bases = true

# Third-party packages without type information (no py.typed, no stubs on PyPI).
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "sklearn.*"]
ignore_missing_imports = true

# --- import-linter: Python boundary rules from .kiro/steering/structure.md ---
[tool.importlinter]
root_packages = ["doppelganger_contracts", "doppelganger_engine", "model_lab", "doppelganger_mcp"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Python packages never import from apps/engine"
type = "forbidden"
source_modules = ["doppelganger_contracts", "model_lab", "doppelganger_mcp"]
forbidden_modules = ["doppelganger_engine"]

[[tool.importlinter.contracts]]
name = "The engine imports model_lab only through its published inference module"
type = "forbidden"
source_modules = ["doppelganger_engine"]
forbidden_modules = [
    "model_lab.calibration",
    "model_lab.codecs",
    "model_lab.datasets",
    "model_lab.evaluate",
    "model_lab.export",
    "model_lab.golden",
    "model_lab.haunt_scripts",
    "model_lab.haunt_set",
    "model_lab.haunting",
    "model_lab.manifest",
    "model_lab.metrics",
    "model_lab.report",
    "model_lab.synthetic",
    "model_lab.windows",
]
allow_indirect_imports = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = [
    "apps/engine/tests",
    "packages/contracts/tests",
    "packages/model-lab/tests",
    "packages/doppelganger-mcp/tests",
    "scripts/tests",
]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
