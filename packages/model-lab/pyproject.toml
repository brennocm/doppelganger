[project]
name = "doppelganger-model-lab"
version = "0.0.0"
description = "Doppelgänger model lab: evaluation, calibration and ONNX export."
requires-python = "==3.12.*"
license = "MIT"
# Runtime: only what the shared inference module (model_lab.inference) needs,
# because the engine and the MCP server import it.
dependencies = [
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
]

[project.optional-dependencies]
# Offline lab tools: evaluation metrics, ONNX export and quantization.
# Never installed in the engine image.
lab = [
    "scikit-learn==1.9.1",
    "onnx==1.23.2",
    "torch==2.15.0",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "model_lab"
