# License policy for every installed npm and Python dependency.
# Enforced by scripts/check_licenses.py in `mise run check:all` (Requirement 4.4).

# SPDX IDs allowed for every dependency, runtime and development.
allowed = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "0BSD",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "Python-2.0",
  "PSF-2.0",
]

# Additionally allowed for development-only dependencies, used unmodified.
# Never allowed for runtime dependencies shipped in the Pages artifact or the engine image.
dev_only = ["MPL-2.0"]

# Overrides for packages whose metadata has no SPDX expression (only a license
# category or free text). Keyed by "name==version", so every version bump forces a
# fresh check. Every entry needs a comment line directly above it citing the
# project's license file at that exact release. The checker enforces this.

[python.overrides]
