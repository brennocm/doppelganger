# Doppelgänger toolchain and command interface.
# Every command a developer, Kiro or CI runs goes through these tasks.
# Versions are exact pins; see docs/adr/0001-stack.md for the reasons.

min_version = "2026.10.21"

[tools]
node = "26.13.0"
pnpm = "12.16.1"
python = "3.12.16"
uv = "0.13.6"
shellcheck = "0.11.0"
# Bats (MIT, bats-core): tests for scripts/install.sh with stubbed commands (local-runtime 6.4).
bats = "1.14.0"
gitleaks = "8.30.1"
lefthook = "2.2.2"
# GitHub MCP server for Kiro (.kiro/settings/mcp.json); pinned here so mise.lock verifies it.
"github:github/github-mcp-server" = "2.0.3"

[env]
# uv must use the mise-pinned Python, never download its own.
UV_PYTHON_DOWNLOADS = "never"
# Base path for the Pages build: "/<repo>/" on GitHub Pages, "/" for custom domains and self-hosting.
PAGES_BASE = "{{ get_env(name='PAGES_BASE', default='/') }}"

[tasks.deps]
description = "Install JS and Python dependencies from the committed lockfiles"
hide = true
run = [
  "pnpm install --frozen-lockfile --silent",
  "uv sync --locked --quiet",
]

[tasks."lint:shell"]
description = "ShellCheck every tracked shell script"
hide = true
run = "git ls-files -z --cached --others --exclude-standard -- '*.sh' | xargs -0 -r shellcheck --severity=style"

[tasks.check]
description = "Definition of done: format, lint, typecheck, boundaries, unit and property tests"
depends = ["deps"]
run = [
  "pnpm exec biome ci .",
  "pnpm -r run typecheck",
  "pnpm --silent boundaries",
  "uv run --locked ruff check .",
  "uv run --locked ruff format --check .",
  "uv run --locked mypy apps/engine/src packages/model-lab/src packages/doppelganger-mcp/src",
  "uv run --locked lint-imports --no-cache",
  { task = "lint:shell" },
  "scripts/test.sh",
]

[tasks."secrets:history"]
description = "gitleaks over the full git history"
hide = true
run = "gitleaks git --redact --no-banner --verbose ."

[tasks."check:all"]
description = "check plus builds, E2E, audits, license check and full-history secret scan (CI)"
depends = ["deps"]
run = [
  { task = "check" },
  "scripts/check-forbidden-paths.sh --all",
  { task = "secrets:history" },
  "scripts/audit.sh",
  { task = "build:pages" },
  # E2E and browser suites: every workspace package with an "e2e" script (Playwright).
  "pnpm -r --if-present run e2e",
]

[tasks.fix]
description = "Apply every auto-fix"
depends = ["deps"]
run = [
  "pnpm exec biome check --write .",
  "uv run --locked ruff check --fix .",
  "uv run --locked ruff format .",
]

[tasks.dev]
description = "Web app and landing dev servers"
run = "echo 'dev: not implemented yet (audio-capture, landing-page specs)'"

[tasks."dev:engine"]
description = "Pro engine via Docker Compose"
run = "echo 'dev:engine: not implemented yet (local-runtime spec)'"

[tasks.test]
description = "Tests; accepts a target, e.g. mise run test -- packages/detector"
depends = ["deps"]
run = "scripts/test.sh"

[tasks."gen:contracts"]
description = "Regenerate TS and Python types from JSON Schema"
depends = ["deps"]
run = "scripts/gen-contracts.sh"

[tasks."model:eval"]
description = "Run the model evaluation harness"
depends = ["deps"]
# Datasets come from $HAUNT_SET_DIR and $BENCHMARK_DIR (outside the repository).
# Extra arguments pass through, e.g. mise run model:eval -- --benchmark-limit 2000
run = "uv run --locked python -m model_lab.evaluate"

[tasks."model:export"]
description = "Export, quantize and verify ONNX models; update the manifest"
depends = ["deps"]
# No argument: the synthetic CI model into apps/web/public/models. `-- aasist-l` or
# `-- aasist`: fp32 ONNX of a pinned candidate into $DOPPELGANGER_CACHE/onnx (design P31).
run = "uv run --locked python -m model_lab.export"

[tasks."build:pages"]
description = "Build landing (/) and app (/app/) into one Pages artifact"
depends = ["deps"]
run = "scripts/build-pages.sh"

[hooks]
# Install the git hooks (lefthook.yml) whenever the toolchain is installed.
postinstall = "lefthook install"
